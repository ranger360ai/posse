# codex agent-detection override — posse (rangerhq-7ia)
#
# Fork of herdr's remote manifest codex 2026.08.09.1, with five additions.
# Upstream reads codex's "Hooks need review" dialog (and every other codex
# modal whose footer says "esc to go back") as *idle*: no rule matches and
# detection falls through to default_known_agent_idle_fallback. A prompt sent
# to a pane in that state is typed into the dialog, not the composer — the
# agent_prompt_stalled failure, silent.
#
# Additions, each marked `# posse:` below:
#   hooks_review        — the startup modal, matched on its own text (mirrors
#                         trust_directory, so it survives footer/region drift)
#   live_strong_blocker — "esc to go back" alongside the existing
#                         "esc to cancel"; codex uses both for the same
#                         confirm-or-back footer, so this also catches
#                         /model, /approvals, and whatever modal codex adds next
#   update_menu         — the "Update available!" release menu (rangerhq-9py0),
#                         footed "Press enter to continue" — a footer no other
#                         rule here matches, so it fell through to idle too
#   signin_menu         — the startup SIGN-IN menu a codex with no credentials
#                         draws (ranger-base-n6s2u), same "Press enter to
#                         continue" footer, same fallthrough to idle
#   signin_api_key      — the API-key field that menu's option 3 opens, found
#                         in the same pass and idle for the same reason
#
# Install:  make install-detection      Verify: scripts/verify-detection.sh
# Retire this file when herdr ships a remote codex manifest that reports
# blocked for etc/herdr/agent-detection/testdata/*.txt — see the README.
id = "codex"
# posse_forked_from = "2026.09.05.1"   <- read by scripts/verify-detection.sh
# Re-checked against upstream 2026.09.05.1 on 2026-09-07 (ranger-base-k39dz):
# upstream added its own `startup_update` rule (bottom_non_empty_lines(20),
# priority 950) that now catches the "Update available!" menu our
# `update_menu` was written for — swapping in the pure upstream manifest and
# replaying the fixtures turns blocked-update-menu green. It still misses
# hooks_review, live_strong_blocker's "esc to go back" wording, and both
# sign-in screens (blocked-hooks-review, blocked-model-picker,
# blocked-signin*) — those five stayed idle/none. Not retiring: five of our
# six rules remain unmatched upstream. `update_menu` itself is left in place
# rather than trimmed as redundant — this bead only re-checks retire-vs-keep,
# it doesn't prune rules upstream has since duplicated.
# herdr requires a dotted-numeric version; the trailing .10x marks this as ours.
version = "2026.08.09.103"
min_engine_version = 3
updated_at = "2026-08-09T00:00:00Z"

[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1100
region = "osc_title"
visible_blocker = true
contains = ["Action Required"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1050
region = "osc_title"
visible_working = true
regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)']

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "after_last_prompt_marker"
skip_state_update = true
contains = ["↑/↓ to scroll", "pgup/pgdn to", "home/end to jump", "q to quit"]
any = [
  { contains = ["esc to edit prev"] },
  { contains = ["esc/← to edit prev"] },
]

[[rules]]
# posse (rangerhq-7ia): codex's startup "Hooks need review" modal. Matched on
# its own text rather than the shared footer so a footer reword cannot silently
# turn this back into idle. features.hooks=true + a new/changed ~/.codex/hooks.json.
id = "hooks_review"
state = "blocked"
priority = 960
region = "top_non_empty_lines(20)"
visible_blocker = true
all = [
  { contains = ["Hooks need review"] },
  { regex = ['(?s)hooks?\s+(?:is|are)\s+new\s+or\s+changed'] },
]

[[rules]]
# posse (rangerhq-9py0): codex's "Update available!" menu, drawn on a version
# delta BEFORE the composer exists. Nothing else here matches it — its footer
# is "Press enter to continue", not the "esc to go back"/"esc to cancel" pair
# live_strong_blocker keys on, and codex leaves the OSC title blank ("  ")
# while it is up, so osc_title_idle does not fire either. Detection fell all
# the way through to default_known_agent_idle_fallback: idle, rule none.
#
# It is a real blocker and not decoration, which is the distinction
# rangerhq-1xsj drew for grok's splash. MEASURED on codex-cli 0.147.0
# (0.147.0 -> 0.150.1, isolated CODEX_HOME, herdr scratch pane): text sent to
# the untouched menu is DISCARDED — grok's splash buffers it into the composer
# beneath, this one has no composer beneath, and after the menu was dismissed
# the composer still showed its placeholder. So a pane here takes no prompt,
# and blocked is the honest answer.
#
# Matched on the banner plus the numbered option rather than on the footer:
# codex has a second, passive "Update available! / See full release notes:"
# notice in the same binary, and only the MENU holds the keyboard. The
# parenthetical after "Update now" is install-method dependent (`brew upgrade
# --cask codex` here, npm/bun elsewhere), so nothing keys on it.
#
# DO NOT teach anything to answer this screen. The default-selected option is
# "1. Update now", which runs a package upgrade of the operator's pinned
# tooling: ADR 0013 §2 layer 2, and Interstitial.Danger in
# internal/posse/interstitial.go. Blocked here means the launch fails by name
# and a human decides.
id = "update_menu"
state = "blocked"
priority = 940
region = "top_non_empty_lines(20)"
visible_blocker = true
all = [
  { contains = ["Update available!"] },
  { regex = ['(?m)^\s*\S?\s*1\.\s+Update now\b'] },
]

[[rules]]
# posse (ranger-base-n6s2u): codex's startup SIGN-IN menu — what a codex whose
# credentials are missing or expired draws instead of a composer. Same
# fallthrough as update_menu and hooks_review: nothing upstream matches it, its
# footer is the "Press enter to continue" no other rule here reads, and
# `agent explain` answered `idle` / rule `none` /
# default_known_agent_idle_fallback. Not a 0.153.4 regression — nobody had ever
# captured the screen. MEASURED on codex-cli 0.153.4, a fresh empty CODEX_HOME,
# tmux panes at 120/80/60/40 columns.
#
# `blocked` is EARNED here, the rangerhq-1xsj distinction, three ways:
#   - text sent to the untouched menu is DISCARDED. `zzmeasurezz` typed at it
#     echoed nowhere, and the API-key field below (the only text-taking surface
#     this flow reaches) then came up holding its placeholder, not that text.
#     The same send-keys into that field DOES echo — the control that says this
#     reading is a measurement and not a blind rig.
#   - there is no composer beneath. Esc does not undraw the menu, and the SAME
#     launch with credentials present reaches "Ask Codex to do anything" at
#     once. grok's startup_splash buffers into a live composer; this screen has
#     nothing to buffer into.
#   - a BARE DIGIT activates an option, no Enter needed: "3" jumped straight to
#     the API-key field. So a dispatched prompt carrying a "1" would start the
#     ChatGPT browser sign-in flow and a "2" a device-code request.
#
# DO NOT teach anything to answer this screen. Signing in is identity and money
# (crew guardrail 1), and an unauthenticated seat is a launch REFUSE that names
# the reason — ADR 0013 §2 — not a screen to type through.
#
# Keyed on two of the numbered options, never the footer: "Press enter to
# continue" is update_menu's footer too, so a reword must not be able to return
# this screen to idle (hooks_review is keyed that way for the same reason).
#
# region 25 rather than the siblings' 20, and it is measured: the menu sits
# under codex's startup ASCII logo, which is NOT a constant height — 60 fresh
# launches at 60 columns (ranger-base-k987u) drew 22 distinct arts at TWO
# non-empty heights, 15 rows (40 draws) and 16 rows (20 draws), the extra row
# being a thin tail that pushes everything below it down one line. On a
# 120-column pane the logo's height doesn't move the numbered options enough
# to matter (19/21 at 15 rows); at 60 columns the prose above option 2 wraps
# and the two heights land on 23 (testdata/codex/blocked-signin-narrow.txt)
# and 24 (testdata/codex/blocked-signin-tall-logo.txt) — the deepest seen. 25
# is that deepest-seen-plus-one, the same margin this rule has always kept
# rather than pinning to the exact edge: a 24 region reads the 16-row pane
# with zero headroom, one taller logo art or one narrower rewrap away from
# falling back to default_known_agent_idle_fallback on the exact screen this
# rule exists to keep untyped-into. At 40 columns codex drops the logo and
# the whole screen is 15 lines.
id = "signin_menu"
state = "blocked"
priority = 930
region = "top_non_empty_lines(25)"
visible_blocker = true
all = [
  { regex = ['(?m)^\s*\S?\s*1\.\s+Sign in with ChatGPT\b'] },
  { regex = ['(?m)^\s*\S?\s*2\.\s+Sign in with Device Code\b'] },
]

[[rules]]
# posse (ranger-base-n6s2u): the API-key entry screen behind the sign-in menu's
# "3. Provide your own API key". Found in the same pass, `idle` / rule `none`
# for the same reason: it is one text field footed "Press enter to save" and
# "Press esc to go back" on two separate lines, so live_strong_blocker's
# single-line "press enter to confirm or esc to go back" does not reach it.
#
# For a dispatched prompt this screen is worse than its parent. The field TAKES
# typed text (that is the control arm cited above), and Enter would store
# whatever was typed into auth.json as a credential. Nothing may type here.
#
# Keyed on the screen's own heading plus the field's own words — both inside
# the first 20 non-empty lines at every width measured (17 and 18 at 120 and 80
# columns, 3 and 5 at 40, where the logo is dropped). 20 is deliberate, not
# widened alongside signin_menu's 24->25 (ranger-base-k987u): codex's logo is
# 15 OR 16 non-empty rows (see signin_menu above), which puts this screen's
# deepest clause at 19 on a 60-column pane either way — one line of headroom
# under the real distribution, the same margin signin_menu's 25 restores.
id = "signin_api_key"
state = "blocked"
priority = 920
region = "top_non_empty_lines(20)"
visible_blocker = true
all = [
  { contains = ["Use your own OpenAI API key"] },
  { contains = ["Paste or type your API key"] },
]

[[rules]]
id = "trust_directory"
state = "blocked"
priority = 950
region = "top_non_empty_lines(20)"
visible_blocker = true
all = [
  { regex = ['\A> You are in [^\r\n]+(?:\r?\n|$)'] },
  { regex = ['(?s)Do\s+you\s+trust\s+the\s+contents\s+of\s+this\s+directory\?'] },
]

[[rules]]
id = "live_strong_blocker"
state = "blocked"
priority = 900
region = "after_last_prompt_marker"
visible_blocker = true
any = [
  { contains = ["press enter to confirm or esc to cancel"] },
  { contains = ["press enter to confirm or esc to go back"] },  # posse (rangerhq-7ia)
  { contains = ["enter to submit answer"] },
  { contains = ["enter to submit all"] },
  { contains = ["allow command?"] },
]

[[rules]]
id = "weak_blocker"
state = "blocked"
priority = 600
region = "whole_recent"
any = [
  { contains = ["[y/n]"] },
  { contains = ["yes (y)"] },
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
]

[[rules]]
id = "screen_working_fallback"
state = "working"
priority = 500
region = "bottom_non_empty_lines(3)"
visible_working = true
line_regex = ['^[•◦]\s+Working \([^)]*esc to interrupt\)(?: · .*)?$']
not = [{ contains = ["■ Conversation interrupted"] }]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 100
region = "osc_title"
visible_idle = true
regex = ['\S']
not = [
  { regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)'] },
  { contains = ["Action Required"] },
]
