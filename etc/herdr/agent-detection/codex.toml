# codex agent-detection override — posse (rangerhq-7ia)
#
# Fork of herdr's remote manifest codex 2026.08.09.1, with three additions.
# Upstream reads codex's "Hooks need review" dialog (and every other codex
# modal whose footer says "esc to go back") as *idle*: no rule matches and
# detection falls through to default_known_agent_idle_fallback. A prompt sent
# to a pane in that state is typed into the dialog, not the composer — the
# agent_prompt_stalled failure, silent.
#
# Additions, each marked `# posse:` below:
#   hooks_review        — the startup modal, matched on its own text (mirrors
#                         trust_directory, so it survives footer/region drift)
#   live_strong_blocker — "esc to go back" alongside the existing
#                         "esc to cancel"; codex uses both for the same
#                         confirm-or-back footer, so this also catches
#                         /model, /approvals, and whatever modal codex adds next
#   update_menu         — the "Update available!" release menu (rangerhq-9py0),
#                         footed "Press enter to continue" — a footer no other
#                         rule here matches, so it fell through to idle too
#
# Install:  make install-detection      Verify: scripts/verify-detection.sh
# Retire this file when herdr ships a remote codex manifest that reports
# blocked for etc/herdr/agent-detection/testdata/*.txt — see the README.
id = "codex"
# posse_forked_from = "2026.08.09.1"   <- read by scripts/verify-detection.sh
# herdr requires a dotted-numeric version; the trailing .10x marks this as ours.
version = "2026.08.09.102"
min_engine_version = 3
updated_at = "2026-08-09T00:00:00Z"

[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1100
region = "osc_title"
visible_blocker = true
contains = ["Action Required"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1050
region = "osc_title"
visible_working = true
regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)']

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "after_last_prompt_marker"
skip_state_update = true
contains = ["↑/↓ to scroll", "pgup/pgdn to", "home/end to jump", "q to quit"]
any = [
  { contains = ["esc to edit prev"] },
  { contains = ["esc/← to edit prev"] },
]

[[rules]]
# posse (rangerhq-7ia): codex's startup "Hooks need review" modal. Matched on
# its own text rather than the shared footer so a footer reword cannot silently
# turn this back into idle. features.hooks=true + a new/changed ~/.codex/hooks.json.
id = "hooks_review"
state = "blocked"
priority = 960
region = "top_non_empty_lines(20)"
visible_blocker = true
all = [
  { contains = ["Hooks need review"] },
  { regex = ['(?s)hooks?\s+(?:is|are)\s+new\s+or\s+changed'] },
]

[[rules]]
# posse (rangerhq-9py0): codex's "Update available!" menu, drawn on a version
# delta BEFORE the composer exists. Nothing else here matches it — its footer
# is "Press enter to continue", not the "esc to go back"/"esc to cancel" pair
# live_strong_blocker keys on, and codex leaves the OSC title blank ("  ")
# while it is up, so osc_title_idle does not fire either. Detection fell all
# the way through to default_known_agent_idle_fallback: idle, rule none.
#
# It is a real blocker and not decoration, which is the distinction
# rangerhq-1xsj drew for grok's splash. MEASURED on codex-cli 0.147.0
# (0.147.0 -> 0.150.1, isolated CODEX_HOME, herdr scratch pane): text sent to
# the untouched menu is DISCARDED — grok's splash buffers it into the composer
# beneath, this one has no composer beneath, and after the menu was dismissed
# the composer still showed its placeholder. So a pane here takes no prompt,
# and blocked is the honest answer.
#
# Matched on the banner plus the numbered option rather than on the footer:
# codex has a second, passive "Update available! / See full release notes:"
# notice in the same binary, and only the MENU holds the keyboard. The
# parenthetical after "Update now" is install-method dependent (`brew upgrade
# --cask codex` here, npm/bun elsewhere), so nothing keys on it.
#
# DO NOT teach anything to answer this screen. The default-selected option is
# "1. Update now", which runs a package upgrade of the operator's pinned
# tooling: ADR 0013 §2 layer 2, and Interstitial.Danger in
# internal/rhq/interstitial.go. Blocked here means the launch fails by name
# and a human decides.
id = "update_menu"
state = "blocked"
priority = 940
region = "top_non_empty_lines(20)"
visible_blocker = true
all = [
  { contains = ["Update available!"] },
  { regex = ['(?m)^\s*\S?\s*1\.\s+Update now\b'] },
]

[[rules]]
id = "trust_directory"
state = "blocked"
priority = 950
region = "top_non_empty_lines(20)"
visible_blocker = true
all = [
  { regex = ['\A> You are in [^\r\n]+(?:\r?\n|$)'] },
  { regex = ['(?s)Do\s+you\s+trust\s+the\s+contents\s+of\s+this\s+directory\?'] },
]

[[rules]]
id = "live_strong_blocker"
state = "blocked"
priority = 900
region = "after_last_prompt_marker"
visible_blocker = true
any = [
  { contains = ["press enter to confirm or esc to cancel"] },
  { contains = ["press enter to confirm or esc to go back"] },  # posse (rangerhq-7ia)
  { contains = ["enter to submit answer"] },
  { contains = ["enter to submit all"] },
  { contains = ["allow command?"] },
]

[[rules]]
id = "weak_blocker"
state = "blocked"
priority = 600
region = "whole_recent"
any = [
  { contains = ["[y/n]"] },
  { contains = ["yes (y)"] },
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
]

[[rules]]
id = "screen_working_fallback"
state = "working"
priority = 500
region = "bottom_non_empty_lines(3)"
visible_working = true
line_regex = ['^[•◦]\s+Working \([^)]*esc to interrupt\)(?: · .*)?$']
not = [{ contains = ["■ Conversation interrupted"] }]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 100
region = "osc_title"
visible_idle = true
regex = ['\S']
not = [
  { regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)'] },
  { contains = ["Action Required"] },
]
