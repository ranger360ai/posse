# grok agent-detection override — posse (rangerhq-37c)
#
# Fork of herdr's BUNDLED manifest grok 2026.07.16.2, with one addition.
#
# NOTE THE BASE. herdr's *remote* grok manifest on this box is 2026.07.16.1,
# and herdr ignores it: "cached version 2026.07.16.1 is older than bundled
# 2026.07.16.2". Forking the file in ~/.local/state/.../remote/grok.toml —
# the obvious move — would silently DROP background_work_chip_working and
# regress working-detection. This file was extracted from the herdr binary
# itself; see the README for how.
#
# The addition, marked `# posse:` below:
#   startup_splash — Grok's startup screen. Upstream matches no rule there
#                    and falls through to default_known_agent_idle_fallback.
#                    We report the same answer, `idle`, but as a NAMED,
#                    fixture-pinned rule instead of a guess.
#
# THE STATE CHANGED IN rangerhq-1xsj: blocked -> idle, priority 1250 -> 1105.
# 37c added this rule as a blocker on the belief that the splash holds the
# keyboard. Measured on live grok 1.0.5 panes, it does not: the composer
# under it takes a prompt, the first keystroke undraws the menu, and grok's
# own OSC title says idle throughout. The prompt loss that motivated the
# blocker is the boot race — a prompt typed before the TUI takes input —
# which happens 0.6s BEFORE this screen is drawn and reads `idle` from
# herdr's fallback no matter what this rule says. The long note on the rule
# has the timeline.
#
# Install:  make install-detection      Verify: scripts/verify-detection.sh
# Retire this file when herdr ships a grok manifest that names grok's startup
# screen itself — i.e. when testdata/grok/idle-startup-splash*.txt resolves to
# a rule instead of default_known_agent_idle_fallback. See the README.
id = "grok"
# posse_forked_from = "2026.07.16.2"   <- read by scripts/verify-detection.sh
# ...which was the BUNDLED manifest of this herdr build, not a remote one:
# posse_bundled_from_herdr = "0.8.0"
# herdr requires a dotted-numeric version; the trailing .105 marks this as ours
# and keeps it above the bundled .2 so herdr prefers it. ranger-base-z6n bumped
# .104 to .105 when the splash anchor learned the production-width boxed layout.
version = "2026.07.16.105"
min_engine_version = 3
updated_at = "2026-07-16T00:00:00Z"
aliases = ["grok-build"]

# Evidence: Grok Build 0.2.101 source and live pane reads.
#
# Grok emits OSC 0 titles by default. Idle is "grok" or
# "<session> - grok". During a turn, the configured title gains a braille
# spinner and activity text. Permission prompts add "⚠ Action Required";
# that prefix blinks while the terminal is unfocused, so visible blocker
# rules outrank the generic non-idle title rule.
#
# Grok also emits OSC 9;4 progress on supported terminals. Herdr retains the
# payload after "9;": "4;1;-1" while busy and "4;0;0" when idle.
#
# Working turns render one live status line directly above the prompt box:
#   "⠧ Waiting on subagent… 2.8s   13s ⇣29.7k [stop]"
#   "⠴ Explore /tmp/… + 1 more… 5.6s   19s ⇣29.7k [stop]"
# with a braille spinner and a trailing [stop] chip, plus an Esc:cancel
# footer hint. Permission prompts and ask-user-question dialogs replace the
# spinner with "◆" and draw a "┃"-guttered option list:
#   "┃  2 (○) Yes, proceed"
#   "┃  z (○) Type your answer here"
# with footer hints "1/3:select │ Ctrl+o:yolo │ Ctrl+c:cancel" (permission)
# or "Esc:unselect │ Tab:scrollback │ Shift+x:dismiss" (question dialog).
# Idle footers end with "Ctrl+.:shortcuts" and never contain "Esc:cancel".
# The startup splash draws its logo with braille characters, so working
# rules must anchor on the [stop] chip, not on a bare spinner glyph.

[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1300
region = "osc_title"
visible_blocker = true
contains = ["Action Required"]

# posse (rangerhq-37c, re-decided in rangerhq-1xsj): Grok's startup
# screen — the New worktree / Resume session / Quit menu, the "<version> is
# here!" changelog line, and the "Help improve Grok" consent banner.
#
# IT IS NOT A BLOCKER. 37c called it one. rangerhq-1xsj measured it and the
# call was wrong. On grok 1.0.5, live panes, no Enter ever sent:
#
#   - text sent to an untouched splash lands in the composer immediately,
#     and the FIRST keystroke undraws the menu, the changelog line and the
#     version footer. The screen is decoration over a live composer.
#   - grok's own OSC title reads "grok" — its idle signal — the entire time
#     the splash is up. `blocked` contradicted the agent's self-report.
#   - Esc undraws nothing (rangerhq-7sbo). `blocked` was therefore a state
#     that no key posse is willing to press could ever clear, which is not
#     what blocked means: nobody is being waited on.
#   - it never fired in the launch path anyway. Measured timeline of a
#     dispatch-shaped launch: 0.20s herdr calls the pane a known grok agent
#     and reports `idle` from default_known_agent_idle_fallback over a SHELL
#     PROMPT; 0.80s the splash is finally drawn; 0.86s it undraws itself.
#     dispatch's settle wait returns at 0.20s, 0.6s before this rule can
#     match. As a launch guard it was decoration too.
#
# The prompt loss behind 37c and rangerhq-5on is real and reproduces — but
# it is the BOOT RACE, not this screen. Text sent before grok's TUI takes
# input is buffered through the exec and delivered half a second later, and
# the screen at that moment belongs to the shell, which no rule of ours can
# match. Keying this screen `blocked` never covered that and never could.
# That race is rangerhq-3hb5, and the fix leans on this rule staying here:
# a gate that demands a SEEN idle (visible_idle / matched_rule, as opposed
# to herdr's fallback guess) accepts the splash and rejects the boot window
# only because the splash resolves to a rule.
#
# PRIORITY 1105, and that is part of the fix. An idle rule must lose to
# every blocker: left at 1250 it would outrank option_dialog_blocked (1200)
# and the permission rules (1190/1180) and report `idle` over a real
# permission dialog — whose footer matches none of the `not` guards below.
# 1105 sits above osc_title_idle (1100), so a fixture and a live pane give
# the same answer, and below every blocker and every working rule.
#
# KEPT rather than deleted so this screen resolves to a named, fixture-
# pinned `idle` instead of herdr's "no rule matched" fallback, and so
# verify-detection fails the day grok turns the splash into a real modal.
#
# THE ID IS STILL LOAD-BEARING, but no longer to dispatch.
# startupScreenDismissals in internal/rhq/dispatch.go pressed Esc at this
# id when a pane reported blocked; that branch was unreachable the moment
# this rule became `idle`, and rangerhq-6723 retired it. dispatch answers
# no blocked screen now — a blocker is the operator's, always. What still
# keys on the id is verify-detection, which requires the splash fixtures
# to resolve to THIS rule rather than merely to state `idle`, a check that
# would be vacuous otherwise now that the fallback says idle too
# (rangerhq-uglc). Renaming it here means renaming it there.
#
# Deliberately NOT anchored on the consent banner: it survives into a live,
# prompt-accepting composer, and keying on it would strand every grok pane
# forever — testdata/grok/idle-composer-with-consent-banner.txt is the pin.
[[rules]]
id = "startup_splash"
state = "idle"
priority = 1105
region = "whole_recent"
visible_idle = true
contains = ["new worktree", "resume session"]
# The `[channel]` tag is OPTIONAL. rangerhq-7sbo widened this anchor because
# a fresh pane rendered a bare "Grok Build  1.0.5"; rangerhq-1xsj saw the
# same box render "Grok Build  1.0.5 [stable]" on two consecutive panes the
# next day, so the tag is a RACE (grok resolves its channel asynchronously),
# not a per-machine variant. Requiring it drops the rule at random. Both
# fixtures pin it: testdata/grok/idle-startup-splash{,-plain-footer}.txt.
#
# At production width Grok Build is not a footer at all: it is embedded in
# the boxed logo line, after braille art and before the right border. Do not
# anchor this regex to the whole line. The menu `contains` above is the
# discriminator; this is only the second anchor, and must accept both the
# narrow footer and the wide boxed layout (ranger-base-z6n).
line_regex = ['(?i)Grok Build\s+\S+(\s+\[[^\]]+\])?']
not = [
  { contains = ["ctrl+.:shortcuts"] },
  { contains = ["esc:cancel"] },
  { contains = ["enter:send"] },
]

[[rules]]
id = "option_dialog_blocked"
state = "blocked"
priority = 1200
region = "whole_recent"
visible_blocker = true
line_regex = ['^\s*┃\s+[0-9a-z]+\s+\([●○]\)\s']

[[rules]]
id = "permission_hints_blocked"
state = "blocked"
priority = 1190
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = [":select", "ctrl+o:yolo", "ctrl+c:cancel"]

[[rules]]
id = "question_dialog_hints_blocked"
state = "blocked"
priority = 1185
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = ["tab:scrollback", "shift+x:dismiss"]

# Pre-0.2.x permission UI kept for older Grok Build releases.
[[rules]]
id = "permission_scope_selector"
state = "blocked"
priority = 1180
region = "whole_recent"
visible_blocker = true
contains = ["yes, proceed", "no, reject"]
any = [
  { contains = ["use ← → to choose permission whitelist scope"] },
  { contains = ["←/→:scope"] },
]

# Grok clears its OSC busy signals while background work runs. The first
# non-empty row is pinned application chrome, where this animated chip shows
# the number of running background tasks and disappears when the count is zero.
[[rules]]
id = "background_work_chip_working"
state = "working"
priority = 1170
region = "top_non_empty_lines(1)"
visible_working = true
line_regex = ['[⋅:⸬⁙.·]\s+[1-9][0-9]*\s+│']

[[rules]]
id = "osc_progress_working"
state = "working"
priority = 1150
region = "osc_progress"
visible_working = true
regex = ['^4;1;-1$']

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 1100
region = "osc_title"
visible_idle = true
regex = ['(?:^| - )grok$']
not = [
  { regex = ['[\x{2800}-\x{28FF}]'] },
]

# After known idle titles are excluded, any other non-empty Grok title is
# active. OSC progress remains authoritative when a custom title omits the
# spinner but the terminal supports progress reporting.
[[rules]]
id = "osc_title_working"
state = "working"
priority = 1000
region = "osc_title"
visible_working = true
regex = ['\S']

[[rules]]
id = "osc_progress_idle"
state = "idle"
priority = 950
region = "osc_progress"
visible_idle = true
regex = ['^4;0;0$']

[[rules]]
id = "spinner_status_working"
state = "working"
priority = 200
region = "whole_recent"
visible_working = true
line_regex = ['^\s*[\x{2801}-\x{28FF}]\s.*\[stop\]\s*$']

[[rules]]
id = "esc_cancel_hints_working"
state = "working"
priority = 190
region = "bottom_non_empty_lines(2)"
visible_working = true
contains = ["esc:cancel", "ctrl+.:shortcuts"]

# Pre-0.2.x working chrome kept for older Grok Build releases.
[[rules]]
id = "waiting_tool_working"
state = "working"
priority = 120
region = "whole_recent"
visible_working = true
any = [
  { all = [{ contains = ["ctrl+c:cancel", "ctrl+enter:interject"] }, { contains = ["waiting"] }] },
  { line_regex = ['^\s*[\x{2801}-\x{28FF}]\s+(Run|Read|Search|List)\b'] },
]

[[rules]]
id = "prompt_hints_idle"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(2)"
visible_idle = true
contains = ["ctrl+.:shortcuts"]
not = [
  { contains = ["esc:cancel"] },
  { contains = ["ctrl+c:cancel"] },
]
