# The fleet's bd version pin — the operator's HOLD of 2026-08-17 (rangerhq-f49),
# bumped 0.49.1 -> 0.50.3 on 2026-09-01 (ruling ranger-base-qrh1, prerequisites
# ranger-base-yeg1, execution ranger-base-8ufhn).
#
# These keys, and only these keys, are what posse requires of the live box.
# Nothing here is installed over anything: the pinned binary is hand-placed and
# homebrew's keg is the operator's. `make verify-bd-pin` asserts that the live
# machine still matches what is here.
#
# WHY A PIN. bd 0.49.1 auto-spawned a per-repo daemon on any call, and that
# daemon outlived the binary it was exec'd from. `brew upgrade beads` on
# 2026-08-16 deleted /opt/homebrew/bin/bd underneath a running daemon; the
# orphan held FDs on the deleted inode for 12d21h and then degraded every bd
# write on the box for ~40 minutes on 08-26. The 08-16 rollback was verified at
# the COMMAND layer only and the orphan sailed straight through it. *A rollback
# that leaves a live process from the reverted artifact is not a rollback.*
# See NOTES.md, "The pin is not enforced, and the 08-16 rollback left a live
# process" (ranger-base-31md / ranger-base-tdwy).
#
# WHY 0.50.3. 0.50.x removed the daemon class entirely (no `bd daemon` command
# exists), which is the whole failure class above.
#
# The process layer that would have caught it is STILL HERE and still runs:
# rows 4 and 5 of scripts/verify-bd-pin.sh, and the daemon-shaped cases in
# bdpin_qa_test.go. On 0.50.x it has nothing to find, so it passes vacuously —
# measured 2026-09-01, `make verify-bd-pin` prints "none running" and the
# result rests on the command layer. Deleting a layer that can no longer fire
# is a decision and not a cleanup, so it is left standing until someone rules
# (ranger-base-5xhmz, ranger-base-fyzqf). An earlier draft of this paragraph
# said ranger-base-yeg1 had dropped it. It never did.
#
# What 0.50.x DID add is flush discipline: it no longer auto-flushes
# issues.jsonl after a write, so JSONL-as-truth rests on two carriers and no
# third — the launcher's own writer, which flushes explicitly (Bd.Flush in
# internal/posse/beads.go, called from queuejsonl.go:127, held by
# TestQueueCommitFlushesBeforeItCommits), and bd's pre-commit hook, for every
# commit taken by hand. The hook half is pinned at
# internal/posse/bdflushdiscipline_qa_test.go (ranger-base-yeg1 step 2, written
# then stranded uncommitted, landed by ranger-base-fyzqf).
#
# 0.50.x still reads .beads/beads.db (SQLite). The Dolt-default-init hazard
# landed one minor early (0.50.0, not 0.51.0) and leaves existing SQLite stores
# alone — measured in NOTES.md, "the ~5.3s daemon dial is fixed upstream — by
# deletion, at 0.50.0". The rest of the "beads (bd) substrate" section caught up
# on 2026-09-01 (ranger-base-dep6x): its heading, the HOLD bullet and the
# verify-contract rows now read 0.50.3, and it carries an "OPERATOR RULING
# 2026-08-30: bump to 0.50.3" subsection with the swap and its verification.
# The `dep add` cycle-check CTE is byte-identical on
# 0.50.3 (ranger-base-pkqn tooling stays valid).
#
# KNOWN DEFECT OF THIS VERSION, and it is not a reason to lift
# (ranger-base-bwp7h, measured 2026-10-03). On a store configured
# `no-db: true` — JSONL as the source of truth, no database — the defer WRITER
# is blind: `bd defer <id> --until <date>` sets the status to "deferred",
# prints `* Deferred <id>` and writes no `defer_until`, and `bd update <id>
# --defer <date>` does the same. The value is accepted, reported as success and
# dropped; re-deferring a record that already carries a date leaves the OLD
# date in place and still reports success. The reader is whole, so a date
# written into the JSONL by hand is read back by `bd show`, `bd show --json`
# and `bd list --json` and survives later bd writes — which is what the
# workaround rests on, and re-parking in such a store is therefore a JSONL
# edit, never a `bd defer`.
# It cost four parked question beads in a private no-db store their dates on
# 2026-10-03: posse's readers key a park on the DATE and never on the status
# string, and bd re-surfaces a past-dated park in NEITHER store class, so
# dateless is indefinite.
# `make verify-nodb-defer` re-measures it rather than trusting this paragraph,
# and exits 1 if it is ever GONE — that would mean the pin moved or something
# else is answering as `bd`, and this paragraph would be the stale thing.
# WHY IT DOES NOT ARGUE FOR A LIFT: there is no bd that gets this right and
# still has the mode. 0.50.3 is the last 0.50.x; 0.51.0's own changelog removes
# the JSONL sync layer (phase 5) and the SQLite backend (phase 6) outright, and
# MEASURED on the unlinked 1.2.2 keg, a 1.x binary has no `--no-db` flag and
# answers `defer` on such a store with `Error: no beads database found`. So
# fixing the mode and leaving it are the same migration, which is the line
# below. docs/notes.d/ranger-base-bwp7h.md has the measurements.
#
# LIFTING THE PIN is the operator's, and 1.x is a migration, not a version
# bump: 0.51.0 Phase 2 replaced the SQLite backend with embedded Dolt and does
# not read .beads/beads.db at all. HOLD at 0.50.3 stands.
#
# Step one of any lift past 0.50.x is cutting the tripwire: `--no-daemon` is
# spelled on every posse call in four places — bdGlobalFlags
# (internal/posse/beads.go), CageBdFlags (internal/posse/cageinner.go),
# scripts/verify-bd-pin.sh, scripts/queue-cutover.sh — and the moment a
# >=0.51 binary answers, every one of those calls fails "unknown flag", by
# design (ADR 0056 D5). That is the day's first symptom, not a surprise.
# Runbook: NOTES.md, "beads (bd) substrate".

posse_pinned_version = "0.50.3"   # `bd version` at the time of the pin

# The hand-placed binary the pin lives in. /opt/homebrew/bin precedes this
# directory in the fleet PATH, so `command -v bd` resolving anywhere else means
# something has been linked in front of the pin.
pinned_binary = "~/.local/bin/bd"

[homebrew]
# Homebrew carries beads 1.2.2 as an UNLINKED keg — pulled in as a dependency
# of the linked `gastown`. Unlinked is the entire defence: link it and 1.2.2
# wins PATH silently, which is the 08-16 outage re-armed. `brew pin` is the
# belt and is deliberately NOT asserted as required — installing or pinning a
# formula is the operator's hand, not the devops lane's — so the check accepts
# either "unlinked" or "pinned" and merely says so when only the first holds.
formula = "beads"
