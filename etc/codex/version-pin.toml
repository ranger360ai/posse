# The fleet's codex version pin — ranger-base-poj5.
#
# These keys, and only these keys, are what posse requires of the live box.
# Nothing here is installed over anything: the cask is Homebrew's and
# ~/.codex/config.toml is the operator's, rewritten by codex itself (project
# trust levels, marketplace stamps), so copying either would clobber both.
# `make verify-codex-pin` asserts the live machine still matches what is here.
#
# WHY THIS FILE IS SHAPED UNLIKE etc/grok/version-pin.toml. grok's pin is two
# config keys — a soft ceiling the updater obeys and a hard one the binary
# refuses to start above. codex has neither, and that is measured, not read
# off documentation. RE-MEASURED on the 0.153.4 binary (ranger-base-femsg,
# 2026-09-06; 210 MB Mach-O arm64). `grep -c` still needs LC_ALL=C or it dies
# on the first invalid byte, so every reading below is `LC_ALL=C grep -ac`:
#
#   required_maximum_version     0
#   maximum_version              0
#   minimum_version              0
#   auto_update                  0
#   model_reasoning_effort      28   <- positive control: the grep DOES reach
#                                       codex's config-key strings
#
# and the four keys this file's contract rests on are all present in the same
# read: check_for_update_on_startup 15, allow_login_shell 16,
# developer_instructions 56, trust_level 19.
#
# Never read a zero without the control. So `required_maximum_version` is a
# grok/xAI mechanism; there is no codex equivalent to set, and no version of
# this file can give codex a hard ceiling. That is a result, not an omission:
# ACCEPTED RISK, ranger-base-poj5 — a codex binary that ends up above the pin
# by any route still STARTS. Everything below refuses to MOVE it; nothing
# refuses to RUN it. Re-measured at 0.153.4 and still true.
#
# ONE THING THAT DID CHANGE between 0.150.1 and 0.153.4, recorded so the
# recipe is not read as a rule about codex: `strings` emitted NOTHING on the
# 0.150.1 binary and emits 124,257 lines on 0.153.4. A `strings`-based sweep
# would have reported all five keys as zero on 0.150.1 — control included —
# and would happen to work here. The control is what separates the two, not
# the tool; keep it whichever tool you reach for.
#
# LIFTING THE PIN is an operator action, gated on re-running the list that
# `scripts/verify-codex-pin.sh` prints when upstream moves. Runbook:
# docs/notes.d/ranger-base-poj5.md.

# MOVED 0.150.1 -> 0.153.4 on 2026-09-06 (ranger-base-femsg), on the operator's
# ruling B on ranger-base-ydwn1, after the four re-audit items this file's
# checker prints were re-run against 0.153.4 and passed. The box had already
# been upgraded past 0.150.1 (cask install 2026-09-05 11:13:50) with the cask
# unpinned; `brew pin --cask codex` was applied 2026-09-06 and stays applied.
posse_pinned_version = "0.153.4"   # `codex --version` reports `codex-cli 0.153.4`

# The binary the pin lives in. codex is a Homebrew CASK: the artifact is a
# `binary` stanza symlinking /opt/homebrew/bin/codex at the Caskroom tree, so
# `command -v codex` resolving anywhere else means something was linked in
# front of the pin — or codex was reinstalled by npm/bun/pnpm/the standalone
# installer, each of which is a separate update channel this file does not
# reach. The check resolves the symlink and asserts it lands in the Caskroom
# directory for the pinned version.
pinned_binary = "/opt/homebrew/bin/codex"

[homebrew]
# THE LEVER. `brew pin --cask codex` is the whole refusal, and it is
# maximum_version's shape, not required_maximum_version's: it refuses to
# UPGRADE, never to START. Measured on Homebrew 6.0.20 with the cask at
# 0.150.1 and 0.151.0 in the tap:
#
#   before the pin   `brew upgrade --cask codex -n`  -> "Would upgrade 1 ...
#                                                        codex 0.150.1 -> 0.151.0"
#   after the pin    `brew upgrade --cask codex -n`  -> "Error: Not upgrading
#                                                        1 pinned package", rc=1
#   after the pin    `brew upgrade -n`               -> "==> 1 Pinned cask"
#   after the pin    `brew outdated --cask`          -> "codex (0.150.1) !=
#                                                        0.151.0 [pinned at 0.150.1]"
#
# RE-MEASURED 2026-09-06 on Homebrew 6.0.22 (ranger-base-ydwn1), because the
# numbers above are 6.0.20's and the pin had to be re-applied after the box was
# upgraded past 0.150.1 with the cask unpinned. Both arms still hold:
# unpinned -> "Would upgrade 1 requested outdated package"; pinned -> "Error:
# Not upgrading 1 pinned package", rc=1. It could NOT be measured on codex
# itself — installed == tap == 0.153.4 means there is no upgrade to refuse — so
# it was measured on a stand-in outdated cask, which was unpinned again in the
# same command chain. `brew list --pinned` names codex today.
#
# That rc=1 is why the pin covers the in-TUI update too: codex's own update
# action on a brew install IS `brew upgrade --cask codex` — codex says so
# itself, `codex doctor --json`, .checks["updates.status"].details["update
# action"], and it still reads exactly that on 0.153.4 (ranger-base-femsg),
# which the update menu also prints verbatim: "1. Update now (runs `brew
# upgrade --cask codex`)". So "1. Update now" fails loudly instead of rolling
# the fleet forward. `brew pin` has a documented hole for casks that declare
# `auto_updates true` (they can update themselves outside Homebrew); the codex
# cask declares no such stanza at 0.153.4 either, which is what makes the pin
# load-bearing here.
formula = "codex"
pin_state = "pinned"

[codex_config]
# THE AFFORDANCE KILL, and the half that answers the incident rather than the
# tap. codex's startup update menu default-selects "1. Update now"; one Enter
# on it is how this fleet last moved a codex version with no decision. This
# key stops the menu being drawn at all, permanently — unlike
# `dismissed_version`, which silences exactly one release.
#
# Measured in a four-arm tmux rig against a CODEX_HOME whose version.json says
# the menu is due. RE-RUN 2026-09-06 against codex 0.153.4 (ranger-base-femsg,
# version.json dismissed 0.149.1 / latest 0.199.0, one fresh CODEX_HOME per
# arm); the 0.150.1 run it reproduces used latest 0.151.0. Same four answers:
#
#   key absent                             -> menu draws
#   check_for_update_on_startup = true     -> menu draws
#   unrelated_bogus_key_xyz    = false     -> menu draws   (the wrong arm)
#   check_for_update_on_startup = false    -> NO menu; codex goes straight on
#
# The bogus-key arm is there because "any extra key suppresses it" and "this
# key suppresses it" are different claims and only one of them is true.
#
# The key also still exists UNDER THIS NAME at 0.153.4, which the rig alone
# cannot show — a renamed key and a working one both give "no menu", because a
# key codex does not recognise is ignored in silence. Read off codex's own
# config schema instead: `codex --strict-config exec` rejects an unrecognised
# field by name, and it accepts this one. The wrong arm is a bogus key, which
# it rejects: "unknown configuration field `bogus_key_xyz`".
#
# Lives in ~/.codex/config.toml as a TOP-LEVEL key: appended after a [table]
# header it becomes that table's key and does nothing, silently.
path = "~/.codex/config.toml"
check_for_update_on_startup = false

[rollback]
# grok keeps every build it has ever run in ~/.grok/downloads/, so rolling
# back is `grok update --version <old>`. A Homebrew cask keeps ONE: the
# Caskroom holds only the installed version and homebrew-cask carries no
# version history. `brew cleanup` after any upgrade takes the only copy on the
# box — which is exactly what happened to 0.150.1 between the pin landing and
# ranger-base-k4lza finding the box three minor versions past it.
#
# So the rollback target is asserted, not assumed: verify-codex-pin.sh fails
# if the Caskroom directory for the pinned version stops existing.
#
# This row is stronger than 0.150.1's ever was — measured three ways on
# 2026-09-06 (ranger-base-femsg), and they agree:
#
#   Caskroom/codex/0.153.4          on disk (cask installed 2026-09-05 11:13:50)
#   Homebrew's download cache       codex-package-aarch64-apple-darwin.tar.gz,
#                                   111554884 bytes, sha256 35438da1... — equal
#                                   to the cask's own declared sha256, computed
#                                   from the bytes on this box, not read off it
#   the URL below                   HTTP 200, content-length 111554884 — the
#                                   same byte count as the on-disk copy
#
# Unlike 0.150.1, the tarball IS in Homebrew's download cache: the cache is
# keyed on the CURRENT cask's URL, and the current cask is this version's.
# That copy is what the next `brew cleanup` takes, so it is a convenience, not
# the guarantee; the URL is.
#
# FETCH IT BEFORE LIFTING THE PIN, not after: the moment an upgrade lands,
# the on-box copies are what `brew cleanup` deletes and this URL is all there
# is. (The 0.150.1 artifact was NOT fetched before this pin moved — the
# operator ruled B on ranger-base-ydwn1 with no hold on A, so 0.150.1 now
# exists only at its own upstream URL, recorded in that bead.)
caskroom_dir = "Caskroom/codex/0.153.4"
url = "https://github.com/openai/codex/releases/download/rust-v0.153.4/codex-package-aarch64-apple-darwin.tar.gz"
sha256 = "35438da1fbf7a6db7ddb3bcec84448fa6015ba188461472a97d9d1da7d9c4353"
