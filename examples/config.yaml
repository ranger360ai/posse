# posse config — flat YAML subset (scalars, one-level maps, lists; see NOTES.md)
#
# `posse init` copies this file verbatim into $RHQ_HOME, so it is the seed
# every fresh instance starts from. Everything below is either a harness
# default or commented out: the shipped file names no crew, no operator, no
# machine, and no plan — those are yours to write in.
#
# TO ARM DISPATCH ON A FRESH INSTANCE, in order:
#   1. `beads:`          — the repo(s) whose bd queue dispatch reads.
#   2. `agents/*.md`     — the PIDs it can route to. THIS DIRECTORY SHIPS
#                          EMPTY: `posse agent new <name>` scaffolds one, and
#                          `examples/agents/` beside it holds the reference
#                          PIDs to copy from. They are seeded there and not
#                          here on purpose — a persona in `agents/` is a lane,
#                          and a generic lane nobody staffed outranked the
#                          crew's own personas in label routing.
#                          Routing is by label: a bead's label must match
#                          some PID's `labels:`, or set `default_persona:`.
#   3. `operator:`       — who a persona's ASK question beads are filed at.
#   4. `plan_guard_*` / `budget_*` — the ceilings. Arming an unattended loop
#                          without one of these is arming a token loop
#                          nobody is watching.
#   5. `posse dispatch --dry-run` — routes and reports, launches nothing.
#      Then `posse dispatch -n 1` by hand before anything unattended.
#   6. `autostart_interval:` — LAST. Presence of that one key is the arm
#                          switch for the scheduled loop (see the block at
#                          the bottom).

# ─── session defaults ────────────────────────────────────────────────────────
# Fallbacks used by `posse new` / `posse local` / recipes when a field is omitted.
default_dir: ~
default_env: default        # envs/default.env for plain sessions with no --env-file; persona sessions get only their PID envs: (+ explicit env-files)
default_emoji: ⚙️
# default_runtime: claude   # launch profile for PIDs that name none (claude | codex | grok | runtimes/<name>.yaml)
# default_engine: docker    # container engine for cage: container (built-in docker; or cages/<name>.yaml)
# cage_image: posse-cage:latest  # the image `posse cage build` writes and a caged launch runs

# ─── session worktrees (rangerhq-09o2) ───────────────────────────────────────
# Every DISPATCHED session gets its own git worktree, index and HEAD of the
# bead's repo, on a branch `posse/<session>`; the launcher fast-forwards that
# branch onto the repo's own branch when the bead closes and `posse kill`
# retires the tree. Crew sessions (`posse new`, recipes) keep the operator's
# checkout. Nothing to arm — this is on.
#
# Where the trees go. Must be under $HOME: bd does NOT refuse a .beads
# outside it (measured, rangerhq-80fx), so this is our rule to hold, and a
# session worktree under a reaped scratch dir is work destroyed.
# worktrees: ~/.posse/worktrees
#
# Gitignored paths a fresh worktree does not inherit and a session needs,
# symlinked from the main checkout. Declared, not guessed — linking every
# gitignored path would link build output two sessions then race over.
# worktree_link:
#   - plugin/bin
#   - .claude/settings.local.json

# ─── who ─────────────────────────────────────────────────────────────────────
# The human. Assignee for the ASK question beads a persona files when only
# you can answer (ADR 0005); unset files them unassigned.
# operator: <your bd username>
#
# The instance's exception handler — the one persona dispatch never hires
# (ADR 0033). She is not a lane: a bead assigned to her is unroutable and
# says so, her PID is skipped in label routing, and naming her as
# `default_persona:` is reported as a config error. No flag overrides it;
# you reach her in her own crew session, which dispatch already leaves
# alone. Coordinator authority — session direction and `git push` — is a
# single-writer resource, so it exists only in a session a human opened.
# Unset (the default) = no coordinator = none of the above; the engine
# ships carrying no crew name.
# coordinator: <persona name>

# ─── this instance, on a shared herdr ────────────────────────────────────────
# A tag for this home's sessions in herdr's ONE workspace list. Leave it
# unset unless a second posse home shares this machine's herdr server.
#
# Everything under state/ is namespaced by $RHQ_HOME already; a workspace
# LABEL is not. Two homes that share a persona name, or that type the same
# hand-named session (`smoke`, `dispatch`), put byte-identical labels on the
# one server: the second create refuses with "already exists" (measured — it
# refuses, it does not take over), and neither home's listing can say whose
# a row is. Set this and the label becomes `<instance>/<session>`, so the
# names stop colliding and a foreign row says which home to go ask.
#
# It changes the LABEL and nothing else. Session names, meta files, the work
# prompt, `posse attach <name>` — all unchanged, in every home. Nothing
# parses identity back out of a label; the meta dir is the ownership record.
# Syntax is a session name's (letters, digits, - and _), and a malformed tag
# refuses the launch rather than quietly labelling like an untagged home.
#
# Coexistence is the rest of this file too: a disjoint `beads:` (one repo is
# served by exactly one home), and a distinct
# `autostart_session:` — the herdr startup hook arms one home per server.
# instance: <short tag>

# ─── routing ─────────────────────────────────────────────────────────────────
# Dispatch picks a persona per bead: explicit assignee > label match against
# each PID's `labels:` > this. Unset means an unroutable bead is reported and
# skipped rather than handed to a lane that did not ask for it — which is the
# safe default, so set this only once you have a generalist PID that can
# honestly take anything. Naming the coordinator here is a config error.
# default_persona: <persona name>

# Repo-root files named in every work prompt when present (ADR 0005) — the
# orientation a persona is told to read before it touches anything. Omit the
# key for the default shown here; a present-but-empty key names none.
# orientation:
#   - AGENTS.md
#   - DIRECTION.md
#   - NOTES.md

# ─── tiering (ADR 0003) ──────────────────────────────────────────────────────
# Precedence: --tier > a bead's `tier:<x>` label > tier_by_label below > the
# PID's `tier:` > default_tier > strong.
# default_tier: strong      # model tier for PIDs that name none (strong | standard | fast)
#                           # a tier of `fast` launches only where the wall realizes every PID gate
#                           # (--allow-degraded is never accepted there), and never below a PID's tier_floor:
#
# Bead label → tier at dispatch, which wins over the PID: the shape of the
# work says more about the model it needs than the title of whoever does it.
# Omit the key for the ADR default shown here; a present-but-empty key turns
# label tiering off entirely.
# tier_by_label:
#   doc: fast
#   groom: fast
#   triage: fast
#   scaffold: fast
#   hygiene: fast
#   architecture: strong
#   security: strong
#   adr: strong

# Where a tier goes when the model it names is NOT AVAILABLE on this
# account (rangerhq-oay). A tier is a name; the launch turns it into a
# model id; nothing before this asked whether the account can run that id.
# When it cannot, the launch says so in one line naming persona, tier,
# wanted model and substitute, records `fallback:` in the session meta
# (visible in `posse list` and the cockpit), and runs the substitute. It
# NEVER refuses over availability — "a degraded model is worse than
# nothing" is your call, and `tier_floor:` on a PID is where you record it
# in advance.
#
# KEY: a persona name or a tier name (persona wins). VALUE: a tier name
# (drop a tier on the same runtime), a runtime name (hop runtimes at the
# same tier), or `none` (no substitute — run the unavailable model and say
# so). The default is strong -> standard, which on claude is the strongest
# model falling to the mid one, and unlike `tier_by_label:` above, naming
# one key here does NOT take that default away from everyone else.
# tier_fallback:
#   strong: standard        # the default, written out
#   <persona>: codex        # this lane's fallback is a different runtime
#
# The check itself. It reads the account's model catalog with the same
# credential the plan guard uses, costs no tokens, and shares one reading
# through $RHQ_HOME/state/model-catalog.json — so a successful reading is
# reused for the TTL (rate-limit cooldowns are shared too). Everything
# about it fails OPEN: an unreadable
# credential, an unreachable endpoint or an answer posse does not
# understand all mean "unknown", and unknown launches the tier exactly as
# asked. Only a catalog that was actually read, and that does not contain
# the model, moves anything.
# Every probe attempt (including a 401 or empty answer) is recorded generically
# in $RHQ_HOME/state/model-catalog.log; credentials and headers never are.
#
# `posse gates <persona>` prints the verdict per runtime — run it once to
# see whether the probe answers at all on your box before trusting it.
# model_preflight: false    # turn the check off entirely (default: on)
# model_probe_ttl: 1h       # how long one reading is shared; 0 = every launch asks

# ─── the constitution (ADR 0015) ─────────────────────────────────────────────
# Where `posse promote` takes the fleet's prose FROM: the directory holding
# agents/, config.yaml, recipes/ and skills/ in the repo you draft them in.
# This home is the promoted COPY of that directory — promote writes it, and
# every launch re-hashes it against `promoted.json` beside it (dispatch
# refuses on a mismatch, an interactive launch warns DEGRADED).
#
# Unset is fine and is the shipped default: `posse init` seeds this home from
# the built-in examples and marks the manifest `seeded`, so nothing verifies
# against a commit that does not exist. Set this once you keep the
# constitution in a repo of its own, and `posse promote` needs no argument.
#
# What promote NEVER writes, whatever this says: envs/ (gitignored secret
# values — there is no commit to promote them from, and a copy that widens
# 0600 publishes tokens), state/ (machine-local runtime data), personas/
# (persona memory, ADR 0015 §5).
# constitution: ~/src/<your instance repo>/posse

# ─── the queue ───────────────────────────────────────────────────────────────
# Beads repos — `posse ready`, `posse dispatch` and the cockpit aggregate
# unblocked work from each listed repo's bd database. A path that is missing
# or unreadable is named as a failed scan. Unset = the current directory;
# an explicitly empty list names no repos.
#
# Aggregation is local-only and each repo's beads keep THAT REPO'S
# visibility: nothing here mixes databases or moves a bead between them, and
# a private repo listed beside a public one stays private. A bead's repo is
# also its dispatch cwd — the session's working directory, the commit tree,
# and where verify-after greps for the implementing commit — so list the
# working copy the work actually lands in.
# beads:
#   - ~/code/projA
#   - ~/code/projB

# Which of those repos are PUBLIC — the visibility guard's only input
# (rangerhq-hrz). `posse gates install-hooks <repo>`, and every persona
# launch into a repo, stamp its prepare-commit-msg hook with the answer;
# in a public repo the hook refuses a commit that ADDS instance-ops
# content to `.beads/*.jsonl` — dollar figures, plan names, live
# plan_guard_*/budget_*/autostart_* values, credential locations — naming
# the pattern and the rule (NOTES.md, "Privacy model": bead CLASS, not
# codebase, picks the repo).
#
# UNMARKED IS PUBLIC. That is the point of the key: a repo you add and
# forget is guarded, not silently exempt. Only an explicit `private` buys
# the exemption — a typo'd path, an unreadable config and a value that is
# neither word all come back public. The way through a refusal is to
# re-file the bead in the private db and cite its id from the public one;
# the override is `RHQ_VISIBILITY_OVERRIDE=i-mean-it`, typed by the
# operator, never handed to a session.
#
# It is a lint, not a boundary — the boundary is the routing rule plus the
# repo's visibility. It exists so a mis-routed bead is a refusal at commit
# time instead of a public artifact.
# beads_visibility:
#   ~/code/projA: public
#   ~/code/projB: private

# An instance can teach that lint its OWN confidential vocabulary — a
# client's name, a project codename — without patching the harness. The key
# is the class the refusal names; the value is an ERE in the dialect both
# readers share (POSIX ERE and Go: no single quote, no \d/\s/\b/\t/\w — use
# a [[:class:]]). Flat-YAML applies to the value: one line, a trailing ` #`
# starts a comment, a wrapping pair of double quotes is stripped.
#
# The patterns are appended to the shipped list when the hook is stamped —
# by `posse gates install-hooks` and by every persona launch into the repo.
# An entry that breaks the dialect is REFUSED at stamp time and named, by
# class, in the hook file and in install-hooks output; it is never dropped
# silently. Reasons never echo the value, so keep the class name something
# you are willing to read in a terminal.
#
# Still a lint, not a boundary: a confidential name nobody thought to add is
# exactly the case a pattern list cannot see. See NOTES.md, "Privacy model",
# "When an instance holds someone else's data".
# beads_visibility_patterns:
#   client-acme: Acme[[:space:]]*(Corp|Holdings)
#   codename: (BLUEBIRD|REDSHIFT)
#
# The data ceiling (ADR 0050): the same shape, a different question.
# Visibility says where content may go; the ceiling says whether it may
# exist in a local file on this instance at all — a restricted-tier banner,
# a restricted system's hostname, its export file-name shape — so it is
# scanned in EVERY repo this instance hooks, whatever its `beads_visibility:`
# stamp, above the visibility gate, and always refused by class alone. One
# class namespace across the shipped list and both keys. The remedy is not
# "re-file it": remove the paste, keep the system of record's id.
# THREE ARMS, the same three the visibility key has since 2026-09-03: the
# added lines, the added paths, and every line of the COMMIT MESSAGE (a
# message replicates with the branch). What differs is the gate and the
# remedy — this key refuses in every repo and first. `-m`, `-F`, `-F -` and
# a message reused by `--amend` are scanned; one typed in your EDITOR is not
# — the hook runs before the editor opens (ADR 0050 D5). A refused message
# stays in `.git/COMMIT_EDITMSG` until the next commit overwrites it.
# data_ceiling_patterns:
#   restricted-banner: [[:upper:]]+-RESTRICTED
#   export-name: export-[0-9]{8}\.(csv|xlsx)

# ─── verify-after (ADR 0006 §3) ──────────────────────────────────────────────
# The one handoff the harness files itself: a closed bead with one of these
# labels and no `qa` dependent earns `verify: <title>` -l qa, assigned below,
# linked discovered-from the close. The key absent means `code, devops`; the
# key present but empty turns it off (and then bd is not asked at all). The
# first sweep of a repo files nothing: it seeds the watermark in
# $RHQ_HOME/state/verify-after.<repo>.
#
# `verify_assignee:` is the ONLY source of the assignee — the harness ships
# no crew, so an unset key files the verify bead unassigned. That is ready
# work anyone can claim, rather than work parked on a persona you do not
# have. Name your QA lane's PID here once it exists.
# verify_labels: [code, devops]
# verify_assignee: qa
#
# `verify_batch: N` files ONE verify bead per N closes instead of one per
# close, carrying all N closers, close reasons and commit lists. Unset — the
# default — is N=1, the 1:1 gate. It is not a coverage cut: the same work is
# verified, in one session instead of N. What it divides is the FILING, and
# that is the point — a verify run files follow-up work about half the time,
# so at 1:1 each close begets roughly one more bead of work, which is how a
# queue grows without bound at any headcount. Raise it if your queue's
# branching factor is above 1.0; leave it alone if it is not.
#
# A PARTIAL batch is held for the closes that would fill it, so N stays a
# quantum and does not become a ceiling — bounded by `verify_batch_age:`
# (default 24h), after which it is filed as it stands, so a shop that goes
# quiet mid-batch still gets its last closes verified.
# verify_batch: 4
# verify_batch_age: 24h

# ─── ci-watch ────────────────────────────────────────────────────────────────
# A dispatch pass reads your repo's CI gate on the branch it merges into and
# files ONE bead when it is red — `-l ci-red,devops`, P1, `-t bug` — then
# COMMENTS on that bead, naming the run that cleared the gate, when it is
# green again. It does not close it: ADR 0013 §4 makes the close the
# persona's, so a self-healing red leaves a bead saying "the gate is green,
# close this" for whoever picks it up. It exists because a red gate is
# otherwise silent: `gh run list` is a command somebody has to remember, and
# this repo's own ci.yml sat red for five days and 191 runs before anyone
# looked.
#
# It needs three things: the workflow FILE in the checkout
# (`.github/workflows/<ci_workflow>`), an `origin` on github.com, and an
# authenticated `gh` on PATH. Missing either of the first two means there is
# no gate here and it says NOTHING — a repo with no GitHub CI never hears
# from this. A `gh` that cannot answer means there IS a gate and this pass
# could not read it, which is said once per process, because that one reads
# as an all-clear if it reads as silence. Either way it abstains: it can
# never read a red as a green. Nothing here reruns a workflow or touches the
# gate — one `gh run list` per configured repo per pass, outside the
# launcher lock.
#
# `ci_workflow:` is the workflow file name; unset means ci.yml, and PRESENT
# BUT EMPTY turns ci-watch off entirely (the verify_labels: convention).
# `ci_branch:` overrides the branch, which otherwise is whatever
# origin/HEAD names, then main.
# ci_workflow: ci.yml
# ci_branch: main
#
# ONE BEAD PER EPISODE, never one per push — a red that stays red must not
# become the thing that floods your queue. The dedupe is the open bead
# itself (one that has already been told its gate cleared is stepped over, so
# the next red still gets a bead), and a `cancelled` run counts as no verdict
# rather than as red or green. Measured over this repo's own 300-run history: 7 beads in 6.6 days
# against 196 red runs. While it stays red the bead's streak is re-said on a
# doubling cadence (1, 2, 4, 8, …), so five days of red earn eight comments.

# ─── plan-utilization guard ──────────────────────────────────────────────────
# Percent of the subscription plan's rolling rate windows above which `posse
# dispatch` skips the whole pass, so the fleet leaves headroom for the person
# at the keyboard. Both unset by default: no guard, and no request to any
# usage endpoint at all.
#
# APPLIES WHEN YOUR PROVIDER ADAPTER IS THE SHIPPED ANTHROPIC ONE. The guard
# is two halves (ADR 0012 D1/D4): the mechanism — skip a pass above a
# threshold, fail closed when blind and unattended — is the harness's; the
# reading is a provider adapter's. The one adapter shipped today reads the
# Claude Code OAuth token from the macOS keychain and asks Anthropic's usage
# endpoint. On a provider with no adapter these keys have nothing to read and
# the guard is cleanly off, one explicit line — set your ceilings with
# `budget_pass:`/`budget_day:` below instead.
#
# If the credential or the endpoint is unreadable the guard fails open (one
# stderr line): the fleet never halts on a monitoring failure while a human
# is watching it. Set the thresholds from your own plan's headroom, not from
# these numbers — they are shapes, not recommendations.
#
# One key per window, named `plan_guard_<window>:` after the window the
# adapter reports — the shipped one reports `5h` and `7d`. A key naming a
# window your adapter does not report gates nothing, and says so on stderr
# with the names it does report.
# plan_guard_5h: 70          # skip the pass above 70% of the 5-hour window
# plan_guard_7d: 85          # skip the pass above 85% of the 7-day window
#
# How long an UNATTENDED pass (`posse dispatch --watch`) may keep running with
# no successful reading, measured from the last one and seeded at loop start.
# That is ALL this knob means (ADR 0018): how long quiet tolerance lasts.
# Hand-run passes are never affected — their stderr line has a witness.
#
# Past it the pass forks on whether `budget_pass:`/`budget_day:` below are
# set, because what blindness costs depends on whether anything else is
# still counting:
#   caps UNSET — the plan guard is your only automated brake, so it fails
#     closed: on-meter beads park, and keep parking until one reading
#     succeeds (which resets the clock and lets that same pass run).
#   caps SET — there is a floor under the blind meter, so the pass runs
#     under the LEDGER instead: one loud line per pass naming the blind
#     duration, the read error and the dollars, then Dial E's ordinary rungs
#     (step down at 80%, stop at 100%). Bounded by money, never by the
#     clock — do not reach for a bigger number here to buy a degrade, that
#     is what arming the caps is for. If the cost scan itself cannot be read
#     the floor is gone and the pass parks exactly as the unset case does.
#   caps SET, and the LAST READING left no room — the pass parks anyway,
#     and this is the one the caps do not buy off. The ledger counts
#     dollars; your plan's weekly window is not denominated in dollars and
#     the ledger has never been able to see it. So the licence to run blind
#     is asked of the meter, from the last reading it managed: over one of
#     your `plan_guard_<window>:` thresholds (a sighted pass would have
#     skipped) or at/past the 80% braking rung, and the on-meter lanes park
#     until a reading succeeds. A reading with room, or no reading ever
#     taken on this machine, is the caps-SET case above, unchanged.
#     (2026-08-31, ranger-base-c3vqe: nineteen hours blind on a stale
#     credential, the snapshot frozen at 89% of the weekly window while the
#     account was really at 96% — and the dollar caps held perfectly the
#     whole way down, because dollars were never the thing running out.)
# Off-meter beads launch through all of it (ADR 0013 §3).
#
# Default 10m. The rationale, not a measurement: a fleet at full fan-out
# burns the 5h window at a roughly steady rate, so the gap between your
# threshold and the rate limit itself buys a bounded number of minutes of
# *blind* dispatch; the default spends about a third of that gap and keeps
# the rest. Measure your own burn against your own threshold and set this
# from those two numbers. **0 = never fail closed** — the escape hatch, and
# with caps armed it is quiet tolerance without end, not a degrade.
# plan_guard_blind_max: 10m  # 30s, 5m, bare seconds, or 0 to disable
#
# How long one reading of those windows is shared before anybody asks the
# endpoint again. GET /api/oauth/usage is a metering endpoint, not a
# firehose: the cockpit polling it every 2m all day, plus one request per
# dispatch pass, plus one per `posse cost`, is how it came back 429 for
# three hours straight — with the guard blind and the unattended loop
# failing closed for all of it (rangerhq-tdy8). So all three read one
# snapshot in $RHQ_HOME/state/plan-usage.json and only refresh it past this
# age, which caps the whole instance at ~12 requests/hour. The guard never
# decides on a reading older than half `plan_guard_blind_max:`, whatever
# this says. Default 5m; **0 = no sharing**, every caller asks for itself.
# Retry-After is honoured across processes either way, and every request
# that actually goes out is logged to $RHQ_HOME/state/plan-usage.log — that
# file is the evidence for whether a 429 storm is your own polling.
# plan_usage_ttl: 5m         # 30s, 5m, bare seconds, or 0 to disable
#
# The quiet gap: nothing on this box asks that endpoint at all. `true` is an
# operator ruling that every reader honours — the cockpit header, `posse
# status`, `posse cost` and the dispatch pass alike — and it exists because
# on 2026-09-02 the only way to stop the polling was to comment out the
# thresholds above, which also switches off the brake. With the guard OFF
# (no `plan_guard_<window>:` set) the meter is quiet anyway — but ONLY while
# nothing is spending: no `budget_pass:`/`budget_day:` written and no
# `dispatch --watch` loop running. Nothing is deciding anything on the
# reading and nothing is burning the window it measures, so no request it
# costs is one anybody asked for.
#
# The exception is the whole of ranger-base-ddivo, measured 2026-09-03: with
# the thresholds commented out since 09-01 and the dollar caps set, the box
# asked NOTHING for two days while `--watch` hired against a weekly window
# last read on 09-01 — and the operator found it exhausted by hand. An
# unarmed guard is a ruling about the BRAKE and never was one about the
# METER, so a spending shop keeps refreshing on `plan_usage_ttl:` and says
# the reading's age out loud (`plan meter BLIND 46h00m … the plan guard is
# UNARMED (budget_pass:/budget_day: is set), so nothing is ruling on it`).
# This flag stays the only full mute, because this flag is a ruling somebody
# typed.
#
# Why it is worth a setting. That day a 429 window had been re-arming since
# 03:30Z; the thresholds were commented out and the watch restarted, and the
# box went silent for 94 minutes — until `posse cockpit` was opened in a
# pane. Its plan tick asked the endpoint itself at 20:13:57Z, a second
# instance asked at 21:15:39Z, both drew `429 Retry-After: 3600`, and the
# gap was over twice without anybody deciding it should be
# (ranger-base-4rfw1). A meter reader must never be the thing that re-arms
# the window it is waiting out.
#
# Quiet is guard-OFF, not guard-blind: no blind clock starts, nothing parks,
# nothing degrades. The last reading is still shown everywhere, always with
# its age (`5h 46% · 7d 29% · guard off, last reading 3h27m ago`) — a
# snapshot nobody is refreshing is exactly where a number shown without its
# age starts lying. And while THIS FLAG is the reason, `posse status` says
# so in a line of its own — it disarms a brake you asked for, and a mute
# nobody can see is what that check exists to end. `posse cost --plan` serves that snapshot while it is
# inside `plan_usage_ttl:` and fails loudly past it, rather than hand a
# grepping persona a stale number as a fresh one. Default false.
# plan_usage_quiet: false    # true = no surface asks the usage endpoint
#
# How old that snapshot may get before every surface says so, LOUDLY. The
# park above is measured in minutes; this is the other question, measured in
# hours — the guard has stopped the on-meter lanes and the headroom rule
# (ADR 0018) is deciding park-vs-degrade off the last reading anybody got,
# and nothing used to print how old that reading was. On 2026-09-02 it was
# ten hours old, every hourly re-ask had 429'd, and the whole visible trace
# was one log line per hour (ranger-base-lpoui). Past this age `posse
# status`, every `--watch` pass preamble and the cockpit print the same
# line: `plan meter BLIND 10h09m: last reading 2026-09-02T03:23Z (5h 41% ·
# 7d 89%) — ruling on it under the headroom rule; 10 consecutive 429`, and
# the pulse's governance key gains the hour and the class
# (`guard-blind:10h:429`), so a stretch that keeps growing re-reaches the
# coordinator hourly instead of being deduped once and forgotten. It changes
# NOTHING the guard does — observability only. Read only where a
# `plan_guard_<window>:` above is set: with no meter guard, no headroom rule
# is ruling on anything. Default 2h; **0 = never say it**.
# plan_usage_stale_after: 2h # 2h, 90m, bare seconds, or 0 to disable
#
# Overflow (ADR 0010) — instead of skipping the whole pass when the guard
# trips, run it and send the beads that can move to a SECOND pool at equal
# posture and tier. Unset = the whole-pass skip above, unchanged. A bead
# moves only if the target's parity check is clean for its PID (no
# --allow-degraded here, ever — this is dispatch's own choice), its tier is
# not `strong` (judged work never moves), and the PID has not said
# `overflow: false`. A bead whose own runtime is not on the guarded meter is
# launched ungated, tripped guard or not. Only sessions this pass creates
# move; a found session and an explicit --runtime keep what they have.
# The target must be a SECOND pool: naming the runtime the guard meters
# (claude) is overflow off with a stderr line — spending the hot meter through
# the ladder built to spare it is the guard cancelling itself.
# The move needs an ARMED BRAKE on the target pool, and there are two:
# `plan_guard_overflow_cap:` below, or the target's OWN pool meter fully
# armed — today only grok has one (`grok_guard_week:` + `grok_pool_reset:` +
# `grok_pool_usd_per_point:`, all three). Either arms it; both set, both
# apply and no warning — belt and braces is a posture, not a smell; neither
# is overflow off, one stderr line per pass naming both ways to arm it. A
# HALF-armed meter is off and arms nothing (a meter over local files is
# armed or off, never blind), and the off line says which input is missing.
# The cap counts beads sent to that runtime in a ROLLING 7 days, ledgered
# append-only in $RHQ_HOME/state/overflow.log — it stands in for a meter the
# pool does not have, so where the pool HAS one the cap is optional rather
# than required. Start a cap in single digits for a calibration week and
# raise it only on the pool provider's own usage display. The ledger is
# written on every move either way: it feeds the metric, and a cap set
# later. An unreadable or unappendable ledger takes the CAP off for that
# pass — where the target's meter is armed the move survives on it, and
# where it is not, overflow is off and on-meter beads park.
# A BLIND guard never overflows: no reading, no judgement.
# plan_guard_overflow: codex      # runtime name; unset = skip the pass
# plan_guard_overflow_cap: 5      # beads per rolling 7d; optional where the
#                                 # target pool has an armed meter of its own

# ─── the dispatch epoch (ADR 0028 §2) ────────────────────────────────────────
# The accounting window the two caps below and `autostart_max_beads:` are
# denominated in: `budget_pass:` is the spend of ONE EPOCH, and `-n` bounds
# the launch attempts made in one. Wall-clock aligned — local midnight plus
# whole epochs — so a dispatch loop that dies and restarts mid-epoch measures
# against the same window it was already in, rather than being handed a fresh
# budget by its own crash.
#
# Default 1h, and that number is ASSUMED rather than measured: it is the unit
# an operator reading `posse cost` already thinks in, and it fits ~12 passes
# of a 5m loop, so the epoch is an accounting window and not a pass by
# another name. Tune it against your own numbers — a longer epoch is a
# tighter shop (the same dollars and launches spread over more wall-clock),
# a shorter one is a looser one.
#
# The name `budget_pass:` is unchanged: it is public vocabulary and renaming
# it would break every config in the field. What the output says is `epoch`,
# because that is the window the number was taken over.
# dispatch_epoch: 1h           # 1h, 30m, or bare seconds

# ─── budget caps (ADR 0003 Dial E) ───────────────────────────────────────────
# API-equivalent dollars, measured by the same method as `posse cost`.
# `budget_pass:` is the spend of the beads one dispatch EPOCH fires, from the
# moment that epoch opened (`dispatch_epoch:` above, default 1h — it was the
# pass until ADR 0028 §2); `budget_day:` is the local calendar day's bead spend
# (interactive sessions are in neither — Dial G keeps them visible and
# ungated). Both unset by default and then Dial E is dormant: no scan, no
# arithmetic, exactly today's behaviour.
#   at  80% of the tightest window a session whose tier resolved to
#       `standard` by default runs at `fast` instead — never `strong`, never
#       a tier pinned by --tier or a `tier:<x>` label, never below a PID's
#       tier_floor:, and never where the wall would not realize every gate
#       at fast (ADR 0012 D4 §3 admits no --allow-degraded there);
#   at 100% dispatch stops, one line per bead it did not launch.
# When plan_guard_* above is configured, the plan's 5h/7d utilization joins
# the comparison as a third and fourth window — the soft landing before the
# guard's hard skip.
#
# The pair at the bottom of this block is a SUGGESTED STARTING POINT and the
# shipped example default — not a number tuned to your shop. What carries over
# from one shop to the next is the RATIO, not the dollars: the day cap sits
# several epochs above the epoch cap, so one busy hour brakes on `budget_pass:`
# without closing the whole day, and both sit at the point where a pass costs
# more than you would have spent on the same work by hand. Replace them from a
# week of your own `posse cost` output; the shipped pair is there so the
# worked example in ADR 0018 has a public anchor rather than a placeholder.
# Unlike the plan guard these need no provider adapter beyond the cost one, so
# they are the ceiling to reach for when your runtime has no usage endpoint.
#
# ARMING THESE ALSO CHOOSES THE BLIND POLICY (ADR 0018). Dial E computes from
# posse's own transcripts and needs no credential, so it works exactly when
# the plan guard cannot. Setting either cap therefore turns an unattended
# blind guard from "park the on-meter lanes" into "run loudly under this
# ceiling"; unsetting them turns it back. That coupling is deliberate — the
# alternative was tuning `plan_guard_blind_max:` by hand every time the caps
# changed, which was measured failing (three changes in two days, each on a
# wrong diagnosis) on 2026-08-26.
#
# What these caps do NOT buy is a blind pass with no headroom left on the
# plan meter. They are a ceiling on SPEND and they cannot see your plan's
# weekly window at all, so when the meter's last reading was already over a
# `plan_guard_<window>:` threshold or in the 80% braking band, an unattended
# blind pass parks with the caps armed and counting (2026-08-31, above
# `plan_guard_blind_max:`). Set them as a spend ceiling; they are not a
# substitute for the meter.
# budget_pass: 30             # suggested: one dispatch epoch's spend ceiling
# budget_day: 250             # suggested: the local calendar day's ceiling

# ─── account-degraded: runtimes posse cannot price (ADR 0013 §5) ─────────────
# A runtime whose DOLLARS posse cannot read is account-degraded: `posse cost`
# never calls that spend $0 (ADR 0003 §4), and the caps above cannot see a
# cent of it. Two ways to land here, and `posse runtime check <name>` says
# which:
#
#   UNCOUNTED  no cost adapter reads it at all — its sessions are absent from
#              every total. Any `runtimes/<name>.yaml` of your own is here.
#   UNPRICED   an adapter reads it — turns, tokens, per-bead attribution —
#              and prices none of what it reads. Today that is codex: the
#              work runs on a ChatGPT plan seat, which reports no cost and to
#              which no list rate applies, so its beads print a BLANK in the
#              $ column rather than 0.00.
#
# grok is NEITHER since 2026-08-29: it reports its own per-turn cost and
# `posse cost` totals it, so grok is COUNTED. An `uncounted_cap_grok:` left
# over from before that brakes nothing — `grok_guard_week:` below is grok's
# meter now. Left set, it is not left quiet: every pass that considers a
# launch there names the key once on stderr as not applying and points at
# the brake that does (ADR 0010 §3). A cap that stopped capping because the
# runtime moved out from under it is still a cap that stopped capping.
#
# Such a runtime is still dispatchable — refusing it would be refusing half
# the fleet over a missing reading — but never quiet. Every dispatch pass
# that sent beads there ends with one line naming how many, and dispatch
# ledgers each launch, append-only, in $RHQ_HOME/state/uncounted.log.
#
# `uncounted_cap_<runtime>:` is the brake: beads posse itself launched onto
# that runtime per ROLLING 7 days, the same shape and unit as
# `plan_guard_overflow_cap:` above and for the same reason — the pool has no
# meter posse can read, so a count of what dispatch sent stands in for one.
# It is NOT a bill and posse invents no price table; the spend numbers are
# yours. Past the cap, further beads bound for that runtime are skipped with
# one line each until the window rolls; the count includes the current pass,
# so the cap bites inside a pass and not only between them. An unreadable
# ledger under a set cap parks too — a cap that counts nothing is not a
# brake — and so does one that reads clean but cannot be APPENDED to: it
# would count the same number every pass, so the cap would be spent again
# every pass and record none of it (ranger-base-ws09). Both heal themselves
# the moment the file does; neither touches an unset cap, which stays
# unlimited whatever the ledger can do.
#
# UNSET IS UNLIMITED AND LOUD — the `budget_*` dormancy pattern: nothing is
# braked, and every pass still names the spend. A value that is not a
# positive whole number of beads is named on stderr once a pass and leaves
# the runtime unlimited; a typo must be visible, not a cap that quietly
# stopped capping. Setting a cap is not how a runtime leaves this column —
# filling its cost-adapter seam (ADR 0012 D4) with an adapter that PRICES
# what it reads is. An adapter that only reads leaves the runtime here, and
# rightly: the cap stands in for a missing dollar meter, and reading tokens
# is not one.
# uncounted_cap_codex: 20    # beads to codex per rolling 7 days

# ─── the grok weekly pool guard ──────────────────────────────────────────────
# A SECOND meter, for the one pool whose exhaustion hurts longest. The
# SuperGrok week has no intra-week reset: spent, it is days of nothing, and it
# takes your own Grok — Chat, Voice, Imagine, same bucket — down with the
# fleet. xAI publishes no usage endpoint, but grok writes its own cost per
# turn to disk, so utilisation is computable locally with no network call, no
# credential and no keychain:
#
#     utilisation% = (USD since the last weekly reset) / (USD per point)
#
# THIS READING IS AN ESTIMATE, NOT THE VENDOR'S NUMBER, and posse says so on
# every line it prints. It is also a FLOOR: it sees grok sessions written on
# THIS box — dispatch's and your own CLI — and cannot see the same pool spent
# from a phone or the web. Size the threshold knowing it under-reports.
#
# All three keys are required together. Unset — the default — is today's
# behaviour exactly: nothing is scanned and nothing is said. Armed with a
# reset or a factor missing, the guard is OFF with one stderr line per pass;
# it is never "blind" and never parks a bead, because a local file read has no
# transient outage to wait out and no reading would ever arrive to lift it.
#
# Over the threshold, a bead bound for grok gets one line instead of a launch
# — per BEAD, on the runtime the launch is actually going to, so a drained
# grok pool never parks a claude lane and a bead `plan_guard_overflow:` moved
# onto grok is judged by grok's pool. At the threshold exactly it still runs.
#
# Armed, these three keys are also a brake on the OVERFLOW move itself: with
# `plan_guard_overflow: grok` they arm it with no `plan_guard_overflow_cap:`
# set at all (ADR 0010 §3). Every overflow launch spends this pool from this
# box, so this meter sees all of the drain the move itself causes — which the
# bead cap, a count standing in for a meter, never could.
#
# grok_pool_usd_per_point: is YOUR calibration and posse ships no value for
# it: derive it by reading xAI's own Settings -> Usage display across a
# bracket of known spend. It is empirical and it drifts the day xAI reprices,
# which is why it is config rather than a constant and why every pass logs the
# value it used. The three numbers below are ARBITRARY SHAPES chosen to be
# obviously not anyone's: read your own reset off the vendor's display.
# grok_guard_week: 85              # skip grok beads above 85% of the week
# grok_pool_reset: wed 14:30       # <weekday> <HH:MM>, your local time
# grok_pool_usd_per_point: 0.50    # dollars per percentage point of pool

# ─── load guard ──────────────────────────────────────────────────────────────
# The 1-minute load average above which this instance launches nothing OF ITS
# OWN: a dispatch pass over it is skipped whole with a witness line, its
# refills are skipped, and `posse relaunch` refuses. Nothing already running
# is touched — a saturated box needs its sessions to finish.
#
# **It is the fleet's ceiling, never the crew's** (ranger-base-jfe5z). A
# launch the operator typed — `posse new`, `posse up`, `posse recipe`, the
# cockpit's `d` — is never refused by it: whoever typed that has already made
# the judgement this guard exists to make for an unattended loop. The reading
# is still taken and still printed, as a warning with the same culprit line,
# because that is what makes the missing refusal safe; the session is not
# marked degraded.
#
# Why it exists: a box whose load is far above its core count cannot schedule
# fork(). Every command a session tries to spawn then hangs with no output at
# all, while in-process work carries on, so the fleet looks alive and is not.
# Process limits, ptys and disk all read fine while it happens, which is why
# the elimination tree costs hours and the load average costs one line.
#
# It is a belt, not a cure. Load that posse itself generates is fixed by
# fixing the bug, not by declining to dispatch. What this earns is the load
# posse does not control — an OS update storm, a neighbour's build — where
# starting a session on a box that cannot fork it is strictly worse than
# waiting for the next pass.
#
# The default assumes roughly eight cores. **Load is not normalised by core
# count and neither is that number**: set it from your own quiet baseline —
# several times the quiet number, well under the broken one. **0 = off**,
# which is the pre-guard behaviour.
#
# An unreadable load average gates nothing and says so once: this is a belt
# over `budget_*`/`plan_guard_*`, and a monitoring failure must not be able to
# stop the shop.
#
# A skipped pass names the load AND who is holding it, on a second line:
#
#   load guard: top CPU: 36.9% pid 49235 zsh [ORPHANED 2h30m], ...
#
# `[ORPHANED]` is ppid 1 — a process reparented to init and still burning CPU
# is a leak, and knowing that took an operator running `ps` by hand 2.5h into
# a frozen fleet. That reading is one bounded `ps`, taken only on a pass that
# is already being skipped, and it prints nothing at all rather than delay or
# fail a pass it cannot take it for.
#
# When those orphans are posse's own, they are named individually under it:
#
#   load guard: 16 orphaned gate-shell children (ppid 1, over 20% CPU, over 1m)
#     — REPORT ONLY, nothing was killed:
#     36.9% pid 49235 2h30m: MARK=x; for i in 1 2 3 4 5 6 7 8; do (while :; …
#     13 more like these
#
# A persona Bash line that backgrounds something and returns leaves it
# running: a non-interactive shell does not hang up its background jobs, so
# the child is adopted by init and NOTHING on the box ends it. The guard then
# correctly declines to launch into the wreckage and waits forever, because
# the wreckage has no living parent and nothing is looking for it. That is the
# whole of the 2.5h freeze, and this line is what makes it loud.
#
# "Ours" is read off the argv: a subshell forked from a gated command never
# execs, so it carries the gate shell's PATH preamble, and what is shown is
# the command AFTER that preamble. **It kills nothing, by design.** A persona
# that deliberately starts a long-lived process with a trailing `&` looks
# exactly the same from here, so ending one is the operator's call and needs
# an explicit exception, not a threshold that looked convincing.
# load_guard: 25             # 1-min loadavg ceiling for FLEET launches; 0 = off

# ─── governance: what needs a human (`posse status`) ─────────────────────────
# `posse status` computes the condition set — the closed, enumerated list of
# things that need a human — live from the stores that own each fact: herdr
# (a blocked session), bd (a settled holder, an unanswered question, a bead
# routed to the coordinator), the plan endpoint, the cost ledger, the watch
# loop's flock, and state/pause.yaml. It exits non-zero when the set is
# non-empty OR when a store could not be read: unknown is not an all-clear.
#
# ALWAYS ON, and there is no arm switch. A surface you have to arm is one
# more thing that can be off when it is needed; the reads cost nothing that
# is not already configured (an unarmed plan guard makes no request, and
# Dial E with no cap scans no transcripts).
#
# The same set is drawn as the cockpit's GOVERNANCE block and carried to
# `pulse_persona:` by the pulse tick. Both keys below are optional; the
# values shown are the code defaults.
#
# One row is NOT answerable from a hand-typed command: the plan guard's
# streak lives in the --watch loop's own memory, so a `posse status` run
# from a terminal never reports it. A guard that trips is a SKIP —
# automatic, self-healing — and only a sustained one is a condition.
# attn_question_age: 4h      # how long a -l question / -l risk bead may sit open
# attn_guard_stuck: 2h       # how long the plan guard may skip before it is a condition

# ─── scheduled dispatch (autostart) ──────────────────────────────────────────
# The unattended loop: herdr's [[startup]] hook (plugin/autostart.sh) runs
# `posse dispatch --watch` in a workspace, once per herdr server start. The
# loop lives where you can see it (cockpit row, `posse peek`, one `x` to kill),
# it cannot start in a world with no herdr socket, and it dies when herdr
# does. "Survives reboot" means "comes back when herdr does". Only the default
# herdr server may arm the fleet loop; named-session servers stand down even
# though herdr's plugin registry is global.
#
# DISARMED BY DEFAULT, AND THE DISARM IS A COMMENT. Presence of the
# `autostart_interval:` key — not its value — is the arm switch, which is why
# it ships commented out and why disarming is done by commenting it out again
# rather than by setting some off-value. There is no off-value, and a bare
# `autostart_interval:` with nothing after it is not one: it is a broken arm,
# and the hook refuses it by name and exits nonzero rather than reading it as
# a disarm. Nor are `null` and `~`: those are YAML's own spellings of "unset",
# so both readers see the key with nothing in it and you get exactly the
# bare-key refusal above, not an off switch (ranger-base-fqfw).
# Neither is a value that is not an interval (`banana`, `5min`, `0`):
# the hook checks the grammar `posse dispatch --watch` would have checked and
# refuses it here, where you are standing, instead of arming a loop that dies
# in a session log. `posse status` reads both the same way and says so as G7
# (`arm-broken`), so the two surfaces never disagree about whether you are
# armed. Nothing else in this file starts a process on its own.
#
# The OTHER autostart keys are not refused, because they have defaults and the
# arm switch does not: a value the hook cannot read in `autostart_max_interval:`,
# `autostart_max_beads:` or `autostart_resume:` is named on stderr and replaced
# with the default it would have used had you left the key out. A typo in a
# backoff cap should not stand a fleet down; a typo in the arm switch has
# nothing to fall back on.
#
# Arm it last, and in this order: a dry-run pass, then a hand-run pass, then
# `autostart_dry_run: true` for a cycle, then live. The plan guard or the
# budget caps above are what keep an unattended loop off your ceiling; the
# guard also fails closed here after plan_guard_blind_max: without a reading,
# because this loop is the one with no witness.
#
# Log: $RHQ_HOME/state/dispatch-watch.log, beside dispatch-watch.lock (held
# by the loop for its whole life; `posse dispatch --watch-status` reads it)
# and dispatch-watch.pid (which pid, since when, under what argv).
# autostart_interval: 5m       # base pass interval (30s, 5m, or bare seconds) — THE ARM SWITCH
# autostart_max_interval: 40m  # backoff cap for quiet passes (default: 8x the interval —
#                              # which is also what an unreadable value falls back to)
# autostart_max_beads: 3       # -n, launch attempts per EPOCH (dispatch_epoch:, default
#                              # 1h — ADR 0028 §2; it was per pass before). A cap is
#                              # ALWAYS present: absent key = 3, and 0 (unbounded) only
#                              # ever by saying so — an armed loop must never fire the
#                              # whole ready queue by omission
#                              #
#                              # The loop prints this number in the unit it is spent
#                              # in, once, at the top of its log ("-n 3 = 3 launch
#                              # attempt(s) per 1h0m0s EPOCH, not per pass"). A number
#                              # chosen when the pass was the unit is a much smaller
#                              # ration per hour than it looks (ranger-base-t8tq)
#                              #
#                              # This is ONE of three bounds and never the only one
#                              # (ADR 0020 §5). An epoch's effective width is
#                              #   min(autostart_max_beads,
#                              #       floor(budget_pass / your cost-per-bead),
#                              #       free seats with ready work)
#                              # so raising this alone does nothing: budget_pass:
#                              # above is a spend bound over the same epoch, and the
#                              # third bound is the roster — lane concurrency IS seat
#                              # count, and hiring (a PID file in git) is the knob (§4).
#                              # Sizing rule: set this to the seats you want started
#                              # per epoch, then budget_pass: to at least that many
#                              # times your measured per-bead cost. The caps stay
#                              # denominated in BEADS on purpose: spend is incurred
#                              # per bead, and a seat-denominated cap would let a hire
#                              # silently raise spend authority.
#                              #
#                              # It is bounded PER PROCESS: a dispatch loop restarted
#                              # mid-epoch starts its count again, where the spend cap
#                              # does not (it is re-derived from the transcripts). The
#                              # money bound is the restart-proof one.
# autostart_dry_run: true      # passes route and report, dispatch nothing
# autostart_resume: false      # THE ONLY KEY HERE THAT DEFAULTS ON. Absent, the loop
#                              # passes --resume: a bead whose persona settled without
#                              # closing it is re-prompted, instead of only warning an
#                              # operator who is by definition not watching this loop.
#                              # Set false to get the warning back and nothing else.
# autostart_session: dispatch  # herdr session name (default: dispatch)
# autostart_dir: ~             # session cwd (default: $HOME)

# ─── metrics ─────────────────────────────────────────────────────────────────
# The scorecard vocabulary is derived, not declared: the union of every PID's
# `metrics:` (a persona naming how it is judged is the source of truth) plus
# any ids listed here. Use this only for an id no PID claims yet — the linter
# checks the vocabulary stays one spelling, and `posse scorecard --catalog`
# says which ids it can actually compute.
# metric_ids:
#   - closed-no-reopen
#   - suite-green-on-close

# ─── emoji ───────────────────────────────────────────────────────────────────
# Session name → emoji (exact match first, then substring match).
# A recipe's explicit `emoji:` always wins over this map.
# No brand emojis exist for the coding agents — these are the nearest glyphs:
# ✳️ Claude (Anthropic's starburst), 🪢 Codex (OpenAI's knot), ✖️ Grok (the X).
emoji:
  claude: ✳️
  codex: 🪢
  grok: ✖️
  shell: 🐚
  api: 🔌
  web: 🌐
  db: 🗄️
  test: 🧪
  scratch: 🗒️
  notes: 📓
