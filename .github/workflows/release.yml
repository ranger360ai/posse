# Cut a posse release: build the four tarballs and the four Homebrew bottles,
# render the formula, and stage them all on a GitHub Release (rangerhq-i0n0,
# ranger-base-9vg3).
#
# Trigger: pushing a tag `vX.Y.Z`. That push is the operator's — nothing here
# fires on a branch commit, and nothing here touches ranger360ai/homebrew-tap.
#
# THE RELEASE IS CREATED AS A DRAFT, ON PURPOSE. A published GitHub Release is
# an outward-facing act and the last human check on what leaves the machine
# (crew guardrail 4); the operator reviews the eight artifacts and presses
# Publish. Flip `--draft` off below only as a deliberate decision, in a commit
# that says so.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)build, e.g. v0.3.0"
        required: true

permissions:
  contents: write   # gh release create; nothing else

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # `ref:` is what keeps the TESTED tree and the SHIPPED tree the same
      # commit (ranger-base-dbe). Without it, checkout takes the TRIGGERING
      # ref: on a tag push that is the tag, but on workflow_dispatch it is the
      # branch you dispatched from — while the build below uses --rev <tag's
      # sha>. That path vets and tests main's fixed tree and ships tarballs
      # built from the older tagged commit, which is exactly the recovery
      # anyone reaches for after a failed release.
      #
      # Full history: scripts/release-artifacts.sh builds HEAD in a temp
      # worktree and scripts/audit-silent-reverts.sh walks every commit. A
      # shallow clone makes both of them wrong rather than loud. It also
      # fetches the tags, which the next step needs to resolve one.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # checkout@v5 / setup-go@v6 for the node24 runtime, and setup-go v6's
      # GOTOOLCHAIN=local: ci.yml's setup-go block is where that is argued
      # (ranger-base-wjlkt). Keep the two files on the same two pins — a tag
      # must be built by the toolchain that gated the commit.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: false

      # EVERY attacker-influenced value reaches a run: block through env, never
      # through ${{ }}. GitHub substitutes a ${{ }} into the script TEXT before
      # bash parses it, so a dispatched tag `v1"; id; :"` would RUN here — on
      # this line, before the guard below ever looks at it, in a job holding
      # contents: write (ranger-base-u9at, ranger-base-qqxm). Via env it is
      # data: bash sees `tag="$INPUT_TAG"` whatever the value contains.
      - name: resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        # `[[ =~ ]]` is bash. It is the runner default today; stated so the
        # guard cannot be quietly disarmed by a shell that does not have it.
        shell: bash
        run: |
          tag="$INPUT_TAG"
          [ -n "$tag" ] || tag="$GITHUB_REF_NAME"
          # An allowlist, not a prefix check — this guard is the only thing
          # between a tag name and five downstream shells. `case v[0-9]*)` was
          # a prefix check: it passed `v0.3.0$(id)`, backtick-id, `v9;curl evil`,
          # and `git check-ref-format` accepts every one of those as a REAL tag
          # name (only space and `*` are refused). So pushing such a tag reached
          # the steps below through GITHUB_REF_NAME on the ordinary
          # `on: push: tags: v*` trigger, with no workflow_dispatch involved.
          # Anchored and whole-string: `v`, digits and dots, nothing else. Widen
          # it deliberately if a release ever needs a pre-release suffix; never
          # by loosening the anchors.
          if [[ ! $tag =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "release: refusing to build a non-version ref: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse "$tag^{commit}")" >>"$GITHUB_OUTPUT"

      - name: vet
        run: go vet ./...

      # The repo's own gate, not a lighter one. `make test` is `go test ./...`
      # plus the silent-revert audit — the detector for the failure class a
      # green suite does not report (rangerhq-8rtf). A release that skips it
      # ships the one bug nobody would find.
      - name: test
        run: make test

      # --rev names the same commit that is checked out, by construction of
      # the `ref:` above. Kept explicit so the artifacts state their commit
      # rather than inheriting whatever HEAD happens to be.
      #
      # This writes EIGHT artifacts, not four: the four tarballs and the four
      # Homebrew bottles built from the same binaries (ranger-base-9vg3). The
      # bottles are what stop `brew install` entering its build-from-source
      # path, which is fatal on a Mac whose Command Line Tools are behind its
      # macOS. They are plain tars of the keg — no brew and no Mac needed to
      # build them, which is why this job is still one ubuntu runner.
      - name: build artifacts
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: scripts/release-artifacts.sh --rev "$SHA" --version "$TAG"

      # Rendered here rather than hand-written in the tap, and attached to the
      # release so the operator copies a file instead of transcribing four
      # sha256s. See docs/runbooks/release.md.
      - name: render the Homebrew formula
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/tap-formula.sh --version "$TAG" --checksums dist/checksums.txt --out dist/posse.rb

      # The notes OPEN with the CHANGELOG section for this version and the
      # generated commit list follows (ranger-base-5356): gh's own help says
      # "Additional release notes can be prepended to automatically generated
      # notes", and --notes-file sets the same body --notes does. That
      # combination is GitHub state and is never exercised on a developer
      # machine, so it is READ, not run — docs/runbooks/release.md Step 1 has
      # the operator check the draft's body before Publish, which is where a
      # gh that ever stopped prepending would be caught.
      #
      # release-notes.sh is called WITHOUT --require here, deliberately. By this
      # step the tag is pushed and the number is spent; a missing CHANGELOG
      # section must degrade to the generated notes, never kill the release.
      # The strict arm is `make release-notes VERSION=vX.Y.Z`, before the tag.
      - name: draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          # GitHub's full error body in the log, not gh's one line: v0.5.0's
          # second run died here with only "HTTP 403: Resource not accessible
          # by integration" to go on (ranger-base-597lo).
          GH_DEBUG: api
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.tag.outputs.sha }}
          NOTES: ${{ runner.temp }}/release-notes.md
        # Arrays are bash, like the tag guard above; stated so the flag cannot
        # be quietly dropped by a shell that splits "${args[@]}" differently.
        shell: bash
        run: |
          scripts/release-notes.sh --version "$TAG" >"$NOTES"
          # GitHub refuses a release body over 125,000 characters with HTTP 422
          # AFTER the tag is pushed — v0.5.0's first run died here with the
          # artifacts already built (ranger-base-597lo). release-notes.sh caps
          # its own output at whole `### ` subsections now, but a workflow_dispatch
          # retry checks out the TAG's tree and runs the reader THAT tree ships,
          # which may predate the cap; so the same cut is applied here too, and
          # it is a no-op for a reader that already capped. Byte-identical
          # pass-through under the limit is what the treepins pin holds.
          limit=60000
          if [ -s "$NOTES" ] && [ "$(wc -c <"$NOTES")" -gt "$limit" ]; then
            awk -v lim="$limit" -v ver="$TAG" '
              { line[NR] = $0; if ($0 ~ /^### /) { sec++ } part[NR] = sec; size[sec] += length($0) + 1 }
              END {
                keep = 0; used = 0
                for (k = 0; k <= sec; k++) { if (k > 0 && used + size[k] > lim) break; used += size[k]; keep = k }
                for (i = 1; i <= NR; i++) if (part[i] <= keep) print line[i]
                if (keep < sec) {
                  kept = 0; for (i = 1; i <= NR; i++) if (part[i] <= keep) kept++
                  printf "\n_This is the opening of the `%s` section: %d of its %d lines. The whole section is CHANGELOG.md in the tagged tree; a release body is capped at 125,000 characters._\n", ver, kept, NR
                }
              }
            ' "$NOTES" >"$NOTES.cut" && mv "$NOTES.cut" "$NOTES"
            echo "release: CHANGELOG section over the body cap — cut to $(wc -c <"$NOTES") characters at a subsection boundary" >&2
          fi
          # No --latest here. GitHub's API says drafts cannot be set as latest,
          # and the flag was added after v0.4.0 (ranger-base-8vx0) without a
          # release rehearsal; v0.5.0's retry died at this call with HTTP 403
          # (ranger-base-597lo). This is the v0.4.0-proven call. The "latest"
          # pointer is set by the operator at publish — runbook Step 1 says to
          # tick "Set as the latest release" — because v0.3.0 stayed "latest"
          # through v0.4.0's publish when nobody did.
          args=(--draft --title "posse $TAG" --generate-notes --target "$SHA")
          if [ -s "$NOTES" ]; then
            args+=(--notes-file "$NOTES")
            echo "release: notes will open with the CHANGELOG section for $TAG:"
            sed -n '1,40p' "$NOTES"
          else
            echo "release: no CHANGELOG section for $TAG — the notes are the generated commit list only" >&2
          fi
          gh release create "$TAG" "${args[@]}" \
            dist/posse_*.tar.gz dist/posse-*.bottle.tar.gz \
            dist/checksums.txt dist/posse.rb

      - name: what happens next
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "Draft release $TAG staged. Two operator steps remain:"
          echo "  1. review and Publish the draft on GitHub"
          echo "  2. copy dist/posse.rb into ranger360ai/homebrew-tap as Formula/posse.rb and push"
          echo ""
          echo "The draft carries four bottles beside the four tarballs. Their names are"
          echo "brew's, not ours — posse-<version>.<tag>.bottle.tar.gz, ONE dash — and brew"
          echo "fetches them from the release by that exact name. Renaming one 404s the"
          echo "install on the platform nobody tested."
          echo "See docs/runbooks/release.md."
